<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3a1a7a"/><stop offset=".55" stop-color="#1c0f45"/><stop offset="1" stop-color="#0d0828"/></linearGradient>
    <linearGradient id="sun" x1=".2" y1="0" x2=".8" y2="1"><stop offset="0" stop-color="#ff6f91"/><stop offset=".6" stop-color="#ff9a5c"/><stop offset="1" stop-color="#ffc35a"/></linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".42"/><stop offset=".5" stop-color="#fff" stop-opacity=".10"/><stop offset="1" stop-color="#9ff3ff" stop-opacity=".30"/></linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="1"/><stop offset=".3" stop-color="#fff" stop-opacity=".12"/><stop offset=".7" stop-color="#fff" stop-opacity=".12"/><stop offset="1" stop-color="#fff" stop-opacity=".9"/></linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="refract" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="inner" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="7"/></filter>
    <clipPath id="r"><rect width="512" height="512" rx="112"/></clipPath>
    <clipPath id="road"><path d="M-30 564C106 486 212 392 228 282Q231 258 254 258H258Q281 258 284 282C300 392 406 486 542 564Z"/></clipPath>
  </defs>
  <g clip-path="url(#r)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <circle cx="90" cy="440" r="130" fill="#5af0ff" opacity=".5" filter="url(#glow)"/>
    <circle cx="440" cy="120" r="120" fill="#a06bff" opacity=".6" filter="url(#glow)"/>
    <circle cx="256" cy="140" r="140" fill="#ff5b7f" opacity=".6" filter="url(#glow)"/>
    <circle cx="256" cy="146" r="80" fill="url(#sun)"/>
    <ellipse cx="234" cy="116" rx="38" ry="18" fill="#fff" opacity=".35" transform="rotate(-28 234 116)" filter="url(#soft)"/>
    <!-- liquid glass road -->
    <g clip-path="url(#road)">
      <g filter="url(#refract)" opacity=".95">
        <rect width="512" height="512" fill="url(#bg)" opacity=".55"/>
        <circle cx="256" cy="330" r="120" fill="url(#sun)" opacity=".9"/>
        <circle cx="90" cy="440" r="150" fill="#5af0ff" opacity=".55"/>
        <circle cx="440" cy="470" r="150" fill="#a06bff" opacity=".55"/>
      </g>
      <rect width="512" height="512" fill="url(#body)"/>
      <path d="M-30 564C106 486 212 392 228 282Q231 258 254 258H258Q281 258 284 282C300 392 406 486 542 564Z" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="22" filter="url(#inner)"/>
      <path d="M-30 564C106 486 212 392 228 282Q231 258 254 258H258Q281 258 284 282C300 392 406 486 542 564Z" fill="none" stroke="#0d0828" stroke-opacity=".25" stroke-width="30" transform="translate(10 -12)" filter="url(#inner)"/>
    </g>
    <path d="M-30 564C106 486 212 392 228 282Q231 258 254 258H258Q281 258 284 282C300 392 406 486 542 564Z" fill="none" stroke="url(#rim)" stroke-width="5"/>
    <g>
      <g fill="#fff" fill-opacity=".92" stroke="#fff" stroke-opacity=".5" stroke-width="2">
        <rect x="251" y="292" width="10" height="24" rx="5"/>
        <rect x="248" y="340" width="16" height="38" rx="8"/>
        <rect x="243" y="404" width="26" height="62" rx="13"/>
      </g>
    </g>
    <ellipse cx="256" cy="-40" rx="330" ry="170" fill="url(#gloss)"/>
  </g>
  <rect x="2" y="2" width="508" height="508" rx="110" fill="none" stroke="url(#rim)" stroke-width="3" opacity=".8"/>
</svg>
